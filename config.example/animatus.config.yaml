# Animatus configuration. Copy this directory to ./config and edit the copy (config/ is git-ignored).
# Relative paths are relative to the project root. Secrets are never written here: refer to them as
# ${secret:name} and put the value in config/.env or in the console's write-only key page.
version: 1

servers:
  stage_port: 5810      # stage page, stage WebSocket and /asset, bound to 127.0.0.1
  console_port: 5811    # console UI and API, bound to 127.0.0.1, needs the start-up token

paths:
  data_dir: ./data
  # Your own files. The orchestrator serves them to the stage as /asset/<kind>/... and never copies them.
  models: C:/path/to/vrm-models
  motions: C:/path/to/motions      # idle/, talk/, poses/<tag>.vrma, dance/<name>/{motion.vrma, music.*, meta.json}
  lipsync: C:/path/to/lipsync      # folder holding profile.json (wLipSync vowel profile); optional, volume lip sync without it
  songs: C:/path/to/songs
  asmr: C:/path/to/asmr

stage:
  model: my-model.vrm              # file name inside paths.models; null shows an empty stage
  background: { kind: none }       # or { kind: color, color: "#1f2a44" } / { kind: image, url: /asset/... }
  lighting: { intensity: 1 }
  camera:
    fit: upper_body                # head | upper_body | full_body | none (none uses position/target/follow_head)
    fov: 20
    locked: false                  # true: the stage ignores the mouse (left drag orbits, right drag pans, wheel zooms, double click resets)
  subtitle:
    enabled: true                  # the words of what is being said, shown while each sentence is spoken
    name: null                     # a name badge above the words, or leave null
    style: bubble                  # bubble | plain
  layout:
    char: { x: 0, y: 0, scale: 1 }
  # Looks that mode packs ask for by name while the mode is active (see docs/modes.md). Optional: a pack can also
  # carry the values itself. When the mode ends the stage goes back to what is written above.
  presets:
    layouts:
      corner: { char: { x: 55, y: 0, scale: 0.4 } }     # the character small in a corner, room for a picture or a game
    backgrounds:
      night: { kind: color, color: "#0a1020" }         # sleep mode asks for it by name; an image works too: { kind: image, url: /asset/models/night.png, dim: 0.3 }
    looks: {}
  # Leave out `browser` to open the stage yourself (OBS browser source, any Chromium in app mode).
  browser:
    executable: C:/Program Files/Google/Chrome/Application/chrome.exe
    profile_dir: ./data/animatus-stage-profile   # keep "animatus-stage" in the path: the VRAM probe keys on it
    window_size: [1920, 1080]

persona: ./personas/example        # folder with persona.md

llm:
  providers:
    - id: primary
      kind: gemini
      model: your-model-name
      api_key: ${secret:gemini}
      proxy: ""                    # e.g. http://127.0.0.1:7890
      thinking_level: minimal      # Gemini 3 family: minimal | low | medium | high (lower is faster).
      # thinking_budget: 0         # Gemini 2.5 instead: 0 turns thinking off. Gemini 3 answers it with HTTP 400.
    - id: local
      kind: openai-compatible
      base_url: http://127.0.0.1:8081/v1
      model: local-model
  order: [primary, local]          # tried in this order; falls back when quota runs out
  history_messages: 10             # latest chat entries sent with every request
  temperature: 1.0

tts:
  # Emotion to reference audio. `whisper` is used by sleep mode. Edited in the console later.
  styles:
    neutral:
      ref_audio: C:/path/to/reference/neutral.wav
      ref_text: What the reference recording says.
  default_style: neutral
  text_lang: zh
  prompt_lang: zh
  split_method: cut5

speech:
  sensitive_words_file: ./config/sensitive-words.txt
  lookahead: 2
  first_comma_min_chars: 10

# Audience input. Snake_case here; the defaults below are the legacy live-stream values.
inbox:
  filter: { danmaku_max_age_sec: 30, max_merge: 3, min_chars: 2, max_chars: 80, repeat_window_sec: 60 }
  pacer: { idle_settle_sec: 1.5, busy_timeout_sec: 20, min_interval_sec: 2 }
  ignore_uids: []
  sleep:                           # how often chat is answered while the sleep mode runs (docs/mode-sleep.md)
    enabled: true
    first_reply_after_sec: 30
    reply_interval_sec: 90
    max_age_sec: 180

sources:
  bilibili:
    enabled: false
    room_id: 1
    # cookie_secret: bili_cookie     # optional: a logged-in cookie in the secret store shows real names

plugins:
  gptsovits:                       # starts GPT-SoVITS itself (needs its own install)
    enabled: true
    config:
      root: C:/path/to/GPT-SoVITS
      python: C:/path/to/GPT-SoVITS/runtime/python.exe
  gptsovits-attach:                # or: use a GPT-SoVITS that is already running
    enabled: false
    config:
      url: http://127.0.0.1:9880
  motion:
    enabled: false
  screencap:                       # copies one window for the commentary mode to look at (Windows only, docs/mode-commentary.md)
    enabled: false
  forge:                           # the image service the draw mode asks; you start Forge yourself with --api (docs/mode-draw.md)
    enabled: false
    config:
      settings_file: C:/path/to/forge-settings.yaml   # start from plugins/forge/settings.example.yaml
      max_long_side: 1024          # multiple of 64, 512 to 2048; the console panel can change it
  singing:
    enabled: false

# Modes take over the stream for a while. Every mode is off until you switch it on here; the folders under
# modes/ say which exist, and the console's Modes page shows which of them fit in GPU memory right now.
modes:
  dance:
    enabled: true
    config:                        # the mode's own settings, all optional (the numbers below are the defaults)
      cooldown_sec: 180            # after a dance, the next one a viewer or the model asks for waits this long
      pending_timeout_sec: 90      # a request waits this long for the reply that carried it to be spoken
      outro_window_sec: 8          # after the dance the model has this long to start its closing line
      start_timeout_sec: 30        # the stage must report the dance as playing within this long
  sleep:                           # a long whisper track, a calm look, rare whispered replies (docs/mode-sleep.md)
    enabled: false                 # needs paths.asmr, a `whisper` entry in tts.styles and the `night` background above
    config: {}                     # volume, fade_in_s, fade_s, shuffle, loop, captions, ... all optional
  draw:                            # draws what a viewer asks for ("画 …") on your own Forge, all-ages (docs/mode-draw.md)
    enabled: false                 # needs plugins.forge and a model that accepts pictures; routes.default.checkpoints is the one required setting
    config:
      routes:
        default:
          checkpoints: [{ name: my-checkpoint, desc: all-round }]
  commentary:                      # comments on what a game window shows (docs/mode-commentary.md)
    enabled: false                 # needs plugins.screencap.enabled and a model that accepts pictures
    config: {}                     # window ("exe:game.exe" or part of a title), interval_sec, language, ... all optional

# What the character remembers between streams (docs/memory.md). Off by default: it keeps what viewers say about
# themselves. Files are Markdown under data/memory; the console's Memory tab edits them.
memory:
  enabled: false
  # dir: ./data/memory
  record_chat: true                # chat messages that reach the model go to the inbox for the consolidation pass
  recall: { max_lines: 8, max_chars: 900, per_speaker: 5, search_cache_days: 7 }
  consolidate: { every_hours: 0, max_viewers: 30, min_messages: 2, max_facts: 5, stream_notes: true }   # 0 hours: only when asked

# What the model may ask the program to do (docs/tools.md). A tool that changes something waits for your yes in the
# console's Approvals tab, and a request that comes from what the audience wrote is refused outright.
tools:
  enabled: true                    # false: the model is told of no tools and tool blocks in its replies are ignored
  tiers: {}                        # by tool name: free | approval | disabled, e.g. { remember: disabled }
  approval_ttl_sec: 600            # a request waits this long for your answer
  max_pending: 20                  # requests waiting at once
  per_minute: 20                   # calls one source may ask for per minute

# The graphics memory modes are admitted against.
vram:
  # budget_mb: 12000               # leave out to read the card's size
  margin_mb: 512                   # kept free for the driver, the desktop and spikes
  resident: [tts]                  # services that stay loaded whatever the mode

console:
  open_browser: false

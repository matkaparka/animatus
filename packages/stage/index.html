<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animatus stage</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .backdrop,
      .backdrop-night {
        position: absolute;
        inset: 0;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        display: block;
        /* The one element that takes the mouse: drag, wheel and double click move the camera (see src/input.ts). */
        pointer-events: auto;
        touch-action: none;
      }
      #overlays {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      .ov {
        position: absolute;
        pointer-events: none;
        color: #fff;
        font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', system-ui, sans-serif;
        text-shadow:
          0 0 4px #000,
          0 0 8px #000;
      }
      .ov-credit {
        left: 2vw;
        bottom: 2vh;
        font-size: max(14px, 1.4vw);
        background: rgba(0, 0, 0, 0.45);
        padding: 0.4em 0.8em;
        border-radius: 0.4em;
      }
      .ov-lyrics {
        left: 10vw;
        right: 10vw;
        bottom: 8vh;
        text-align: center;
        font-size: max(20px, 2.6vw);
        font-weight: 700;
      }
      /* The spoken subtitle: what is being said, in a rounded translucent bubble like the legacy text box. */
      .ov-subtitle {
        left: 50%;
        bottom: 5vh;
        transform: translateX(-50%);
        box-sizing: border-box;
        width: max-content;
        max-width: min(74vw, 1100px);
        padding: 0.7em 1.3em 0.8em;
        border-radius: 1.2em;
        background: rgba(18, 20, 32, 0.62);
        backdrop-filter: blur(8px);
        text-align: left;
        font-size: clamp(18px, 1.9vw, 34px);
        font-weight: 500;
        line-height: 1.65;
        text-shadow: none;
      }
      .ov-subtitle .ov-name {
        display: inline-block;
        margin-bottom: 0.35em;
        padding: 0.05em 0.7em;
        border-radius: 999px;
        background: rgba(120, 90, 255, 0.9);
        font-size: 0.62em;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .ov-subtitle .ov-words {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
        overflow: hidden;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      /* Bare words with a shadow, for a scene that has its own dark strip. */
      .ov-subtitle[data-variant='plain'] {
        background: none;
        backdrop-filter: none;
        text-align: center;
        font-weight: 600;
        text-shadow:
          0 0 4px #000,
          0 0 10px #000;
      }
      .ov-notice {
        top: 2vh;
        left: 10vw;
        right: 10vw;
        text-align: center;
        font-size: max(16px, 1.8vw);
        background: rgba(0, 0, 0, 0.45);
        padding: 0.4em 0.8em;
        border-radius: 0.4em;
      }
      .ov-frame {
        display: flex;
        flex-direction: column;
        border: 0.4vw solid rgba(255, 255, 255, 0.85);
        border-radius: 0.6vw;
        background: rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      .ov-frame img {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      .ov-frame img.ov-shown {
        opacity: 1;
      }
      .ov-frame .ov-caption {
        flex: none;
        padding: 0.4em 0.8em;
        text-align: center;
        font-size: max(14px, 1.4vw);
        background: rgba(0, 0, 0, 0.55);
      }
      .ov-frame[data-state='text'] .ov-caption {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: max(18px, 2.2vw);
        background: none;
        text-shadow:
          0 0 4px #000,
          0 0 10px #000;
      }
    </style>
  </head>
  <body>
    <div id="backdrop"></div>
    <canvas id="stage"></canvas>
    <div id="overlays"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

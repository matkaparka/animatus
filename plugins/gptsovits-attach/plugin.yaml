manifest_version: 1
id: gptsovits-attach
title: GPT-SoVITS (already running)
description: >-
  Use a GPT-SoVITS api_v2 server that you started yourself. Animatus only checks that it answers;
  it never starts or stops it.
version: 0.1.0
kind: tts
service: tts
provides: [tts.reference-audio]

runtime:
  type: external
  url: "{config.url}"

health:
  http: { path: /docs, method: GET, expect_status: 200, ready_field: null }
  start_timeout_ms: 10000
  interval_ms: 5000
  timeout_ms: 3000
  fail_threshold: 3

resources:
  gpu: true
  vram_mb_est: null
  config_keys: []
  note: The server is not ours, so its memory is not managed here.

config_schema:
  type: object
  required: [url]
  properties:
    url:
      type: string
      title: Server address
      description: For example http://127.0.0.1:9880
